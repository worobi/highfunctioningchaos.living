<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Open+Sans:ital,wght@0,300;1,300&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#1A1A1A"/>

  <!-- Subtle corner accent — crimson top-left notch -->
  <rect x="0" y="0" width="6" height="120" fill="#D7263D" opacity="0.6"/>
  <rect x="0" y="0" width="120" height="6" fill="#D7263D" opacity="0.6"/>

  <!-- Chaos Mark — large, centered, upper half -->
  <!-- Bar 1: full, beige -->
  <rect x="172" y="138" width="156" height="18" rx="3" fill="#F5EBDD"/>
  <!-- Bar 2: shorter, shifted right, crimson -->
  <rect x="204" y="176" width="110" height="18" rx="3" fill="#D7263D"/>
  <!-- Bar 3: full, beige -->
  <rect x="172" y="214" width="156" height="18" rx="3" fill="#F5EBDD"/>

  <!-- "HF" in beige, "C" in crimson — stacked initials -->
  <text
    x="250"
    y="380"
    text-anchor="middle"
    font-family="'Bebas Neue', 'Arial Narrow', sans-serif"
    font-size="158"
    letter-spacing="6"
    fill="#F5EBDD">HF<tspan fill="#D7263D">C</tspan></text>

  <!-- Tagline at bottom -->
  <text
    x="250"
    y="440"
    text-anchor="middle"
    font-family="'Open Sans', Arial, sans-serif"
    font-size="13"
    font-style="italic"
    font-weight="300"
    letter-spacing="2"
    fill="#F5EBDD"
    fill-opacity="0.35">Mostly fine. Occasionally feral.</text>
</svg>
