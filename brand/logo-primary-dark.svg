<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Open+Sans:ital,wght@0,300;1,300&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="150" fill="#1A1A1A"/>

  <!-- Chaos Mark — three bars, middle one offset right + crimson -->
  <!-- Bar 1: full, beige -->
  <rect x="24" y="57" width="48" height="6" rx="1.5" fill="#F5EBDD"/>
  <!-- Bar 2: shorter, shifted right, crimson -->
  <rect x="38" y="77" width="34" height="6" rx="1.5" fill="#D7263D"/>
  <!-- Bar 3: full, beige -->
  <rect x="24" y="97" width="48" height="6" rx="1.5" fill="#F5EBDD"/>

  <!-- "HIGH FUNCTIONING" -->
  <text
    x="86"
    y="75"
    font-family="'Bebas Neue', 'Arial Narrow', sans-serif"
    font-size="24"
    letter-spacing="4"
    fill="#F5EBDD"
    fill-opacity="0.82">HIGH FUNCTIONING</text>

  <!-- "CHAOS." -->
  <text
    x="83"
    y="131"
    font-family="'Bebas Neue', 'Arial Narrow', sans-serif"
    font-size="70"
    letter-spacing="2"
    fill="#D7263D">CHAOS.</text>

  <!-- Tagline -->
  <text
    x="87"
    y="147"
    font-family="'Open Sans', Arial, sans-serif"
    font-size="10.5"
    font-style="italic"
    font-weight="300"
    letter-spacing="1.8"
    fill="#F5EBDD"
    fill-opacity="0.42">Mostly fine. Occasionally feral.</text>
</svg>
